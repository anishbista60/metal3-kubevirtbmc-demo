# Step 3b: the KubeVirt VM standing in for a bare-metal server.
#
# - runStrategy: Halted keeps it powered off; Metal3/Ironic powers it on later.
# - The cdrom device has no volume attached yet — KubeVirtBMC hotplugs a
#   volume onto it when Ironic issues a Redfish "insert virtual media" call.
# - macAddress is pinned so it matches BareMetalHost.spec.bootMACAddress;
#   otherwise KubeVirt would assign a random MAC and Ironic couldn't match
#   the host during inspection.
# - masquerade (not bridge, as the original blog post uses) because kind's
#   default CNI has no shared L2 segment between pods — with `bridge: {}`
#   the guest can never ARP its way to another pod's IP (e.g. Ironic's),
#   so IPA boots fine but its callbacks to Ironic never arrive and
#   inspection hangs forever. masquerade NATs guest egress through the
#   pod's own (working) networking instead, which works on any CNI.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: metal3-demo-vm
  namespace: default
spec:
  runStrategy: Halted
  template:
    spec:
      domain:
        cpu:
          cores: 4
        memory:
          guest: 8Gi
        devices:
          disks:
          - name: rootdisk
            disk:
              bus: virtio
          - name: cdrom
            cdrom:
              bus: sata
          interfaces:
          - name: default
            macAddress: "02:00:00:00:00:01"
            masquerade: {}
        firmware:
          bootloader:
            efi:
              secureBoot: false
      networks:
      - name: default
        pod: {}
      volumes:
      - name: rootdisk
        persistentVolumeClaim:
          claimName: metal3-demo-vm-disk
