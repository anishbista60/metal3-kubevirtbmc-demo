# Fallback (VIRTUAL_MEDIA_TLS=false): the Ironic API uses TLS, virtual media
# images are served over plain HTTP. disableHostNetwork is set because we're
# on a kind cluster with no provisioning network — in-cluster DNS is enough
# since we only use Redfish virtual media, not PXE/DHCP.
apiVersion: ironic.metal3.io/v1alpha1
kind: Ironic
metadata:
  name: ironic
  namespace: baremetal-operator-system
spec:
  apiCredentialsName: ironic-credentials
  networking:
    disableHostNetwork: true
  tls:
    certificateName: ironic-cert
    disableVirtualMediaTLS: true
  version: "39.0"
