# Step 3c: KubeVirtBMC credentials + the VirtualMachineBMC that stands up a
# virtual Redfish/IPMI endpoint in front of metal3-demo-vm.
apiVersion: v1
kind: Secret
metadata:
  name: metal3-demo-vm-bmc-secret
  namespace: default
stringData:
  username: admin
  password: password
---
apiVersion: bmc.kubevirt.io/v1beta1
kind: VirtualMachineBMC
metadata:
  name: demo-bmc
  namespace: default
  annotations:
    # Pad the virtual media DataVolume so the ~500 MB IPA ISO still fits after
    # filesystem overhead on local-path storage (KubeVirtBMC >= v0.11.0).
    bmc.kubevirt.io/datavolume-size-margin: "15"
spec:
  virtualMachineRef:
    name: metal3-demo-vm
  authSecretRef:
    name: metal3-demo-vm-bmc-secret
  redfish:
    virtualMedia:
      tls:
        # Trust Ironic's CA when fetching HTTPS virtual media
        # (KubeVirtBMC >= v0.11.0). Unused when virtual media is plain HTTP.
        caBundleConfigMapRef:
          name: ironic-ca
